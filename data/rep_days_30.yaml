method:
  options:
    total_periods: 365
    representative_periods: 30
    time_steps_per_period: 24
    sampling_time: "Hour(1)"
    mandatory_periods: []

  optimization:
    integral_weights: false
    binary_ordering: true
    equal_weights: true

    duration_curve_error:
      weight: 1.0
      number_bins: 10
      type: "absolute"

results:
  save_results: true
  result_dir: "repdays_30"
  create_plots: false

